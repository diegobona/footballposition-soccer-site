{{- with site.Params.homeInfoParams }}
<section class="home-info" aria-labelledby="home-info-title">
    <div class="home-info__copy">
        <header class="entry-header">
            <h1 id="home-info-title">{{ .Title | markdownify }}</h1>
        </header>
        <div class="entry-content">
            {{ .Content | markdownify }}
        </div>
        <a class="home-info__action" href="/overview/">
            Explore all positions
            <span aria-hidden="true">→</span>
        </a>
        <p class="home-info__guides">Featured guide: <a href="/posts/box-to-box-midfielder-the-complete-guide-to-footballs-most-demanding-position/">Box-to-box midfielder: role, skills and examples</a></p>
    </div>
</section>
{{- end }}
