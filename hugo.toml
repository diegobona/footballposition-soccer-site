baseURL = 'https://footballposition.soccer/'
languageCode = 'en-us'
title = 'Soccer Positions'
theme = "PaperMod"
buildFuture = true
enableRobotsTXT = true

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  defaultTheme = "light"
  description = "Position guides, tactics, and training tips for every football role — from goalkeeper to false nine."
  keywords = ["football positions", "soccer positions", "tactical roles", "position guides", "training drills", "player development", "defensive positions in soccer", "defensive positions"]
  mainSections = ["posts"]
  ShowPageNums = true

  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#0B5D3B"
    msapplication_TileColor = "#0B5D3B"

  [params.label]
    text = "Soccer Positions"
    icon = "brand/football-position-mark.svg"
    iconHeight = 36

  #开启 PaperMod 的 Home Info 块（没有文章也能展示）
  [params.homeInfoParams]
    Title = "Soccer Positions – Master Every Role on the Pitch | Position Guides, Drills & Pro Tips"
    Content = "From goalkeeper to false nine, FootballPosition.soccer breaks down every football position’s duties, skill-set, tactical role and weekly training plans. Learn how to read the game, choose your gear and level up with position-specific drills used by pro clubs—all in clear, concise language for players, coaches and fans."

[menu]
  [[menu.main]]
    name = "Positions"
    url = "/overview/"
    weight = 5
  [[menu.main]]
    name = "Tactical Previews"
    url = "/tactical-preview/"
    weight = 10
  [[menu.main]]
    name = "Match Analysis"
    url = "/match-analysis/"
    weight = 20


