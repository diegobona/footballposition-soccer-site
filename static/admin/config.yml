backend:
  name: github
  repo: diegobona/footballposition-soccer-site
  branch: main
  base_url: https://footballposition.soccer
  auth_endpoint: oauth
  api_root: https://api.github.com
site_url: https://footballposition.soccer/
display_url: https://footballposition.soccer/
publish_mode: simple
media_folder: "static/images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "posts"
    label: "长尾文章 (Level 3)"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "文章标题 (Title)", name: "title", widget: "string"}
      - {label: "SEO 标题标签（Title Tag，可选）", name: "seo_title", widget: "string", required: false, hint: "例如：False 9 vs Number 10: Key Differences & What About the False 10?"}
      - {label: "元描述（Meta Description，可选）", name: "meta_description", widget: "text", required: false, hint: "建议 120-160 个字符；不填则继续使用默认摘要逻辑"}
      - {label: "自定义 URL Slug（可选）", name: "slug", widget: "string", required: false, hint: "只填写 URL 最后一段，例如 false-10-role；不填则按标题自动生成"}
      - {label: "发布日期 (Date)", name: "date", widget: "datetime"}
      - {label: "所属分类 (Level 2 Hub)", name: "category", widget: "select", options: ["防守位置", "中场位置", "进攻位置", "综述"]}
      - label: "封面图设置 (Cover)"
        name: "cover"
        widget: "object"
        fields:
          - {label: "封面图片 (Image)", name: "image", widget: "image", required: false}
          - {label: "图片描述 (Alt Text)", name: "alt", widget: "string", required: false}
          - {label: "图片标题 (Caption)", name: "caption", widget: "string", required: false}
      - {label: "文章正文 (Body，可直接粘贴/拖拽图片)", name: "body", widget: "markdown"}
